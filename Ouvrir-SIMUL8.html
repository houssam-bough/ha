 */const Ch=Z("X",[["path",{d:"M18 6 6 18",key:"1bl5f8"}],["path",{d:"m6 6 12 12",key:"d8bk6v"}]]),fu=(E=1)=>`./public/cours/${encodeURIComponent("Simulation (2).pdf")}#page=${E}`,Dr=E=>`./public/cours/${encodeURI(E).replace(/#/g,"%23").replace(/\?/g,"%3F")}`,vn=[{id:"fondements",title:"Les fondements de la simulation",subtitle:"Du système réel au modèle",icon:"Layers",color:"green",chapter:"I",pages:"5–16",lessons:["modele","aleatoire"]},{id:"premier-modele",title:"Votre premier modèle SIMUL8",subtitle:"Construire, relier, observer",icon:"Workflow",color:"blue",chapter:"II",pages:"17–54",lessons:["objets","cabinet"]},{id:"items",title:"Items, labels et arrivées",subtitle:"Donner une identité aux flux",icon:"Tags",color:"purple",chapter:"III",pages:"55–61",lessons:["arrivees","labels"]},{id:"files",title:"Files d’attente et stocks",subtitle:"Comprendre ce qui s’accumule",icon:"ListOrdered",color:"orange",chapter:"IV",pages:"62–67",lessons:["files","stock"]},{id:"ressources",title:"Ressources et horaires",subtitle:"Affecter la bonne capacité",icon:"Users",color:"blue",chapter:"V",pages:"68–71",lessons:["ressources","shifts"]},{id:"activites",title:"Activités et routage",subtitle:"Piloter le parcours des items",icon:"GitBranch",color:"purple",chapter:"VI",pages:"72–98",lessons:["routing","resultats"]},{id:"avance",title:"Aller plus loin",subtitle:"Données, logique et synchronisation",icon:"Braces",color:"green",chapter:"VII",pages:"99–125",lessons:["logic","synchronisation"]}],wt=[{id:"modele",title:"Penser en processus",duration:8,page:12,end:18,intro:"Un modèle de simulation raconte le parcours d’un objet dans un système. Avant de dessiner dans SIMUL8, décidez quelle question vous cherchez à résoudre.",objective:"Distinguer le système réel, son modèle et les indicateurs utiles.",sections:[["Commencer par une question","« Faut-il ajouter un troisième médecin ? » est une question de décision. « Dessiner un cabinet médical » ne suffit pas. Choisissez les mesures qui permettront de comparer les scénarios : attente, temps de séjour et utilisation des ressources."],["Suivre un item","Un item est ce qui traverse le processus : patient, pièce, appel ou commande. Repérez son entrée, ses attentes, ses traitements et sa sortie. Les événements, comme une arrivée ou une fin de traitement, modifient l’état du modèle."],["Cartographier avant de chronométrer","Le cours recommande de valider d’abord tous les cheminements, puis d’introduire les durées et les lois d’arrivée. Un schéma juste avec des hypothèses simples vaut mieux qu’un modèle détaillé dont le flux est incorrect."]],takeaway:"Un modèle est utile lorsqu’il répond à une question explicite avec des hypothèses vérifiables.",task:"Sur une feuille, représentez le parcours d’un client de restauration rapide. Entourez les endroits où il peut attendre.",steps:["Écrivez une question : quel effet aurait une seconde caisse ?","Tracez arrivée → file → commande → sortie.","Choisissez deux indicateurs à comparer avant et après."],file:"fastfood.S8",check:"Vous devez distinguer le temps de traitement à la caisse du temps total passé dans le restaurant."},{id:"aleatoire",title:"Apprivoiser l’aléatoire",duration:10,page:5,end:16,intro:"Deux systèmes ayant les mêmes durées moyennes peuvent avoir des attentes très différentes. La variabilité fait partie du modèle.",objective:"Choisir une loi cohérente et comprendre pourquoi on répète une simulation.",sections:[["Fixed ou aléatoire ?","Une durée Fixed est constante. Une loi exponentielle peut représenter un intervalle entre arrivées indépendantes. Une loi triangulaire décrit une durée avec un minimum, un mode et un maximum. Le choix dépend des données et des hypothèses."],["L’idée de Monte Carlo","On transforme des tirages pseudo-aléatoires en observations suivant une distribution choisie. Une graine permet de reproduire la même expérience. Changer la graine donne une autre réalisation du même modèle."],["Une exécution n’est pas une preuve","Un résultat est une réalisation aléatoire. Le cours recommande au moins 30 réplications pour étudier les moyennes et leurs intervalles de confiance. Des réplications distinctes permettent de mesurer la dispersion entre exécutions."]],takeaway:"Même moyenne ne signifie pas même comportement : observez aussi la variabilité.",task:"Dans le laboratoire, comparez des durées fixes et exponentielles avec les mêmes moyennes.",steps:["Conservez un intervalle de 6 min et un traitement de 5 min.","Exécutez une simulation déterministe, puis une simulation exponentielle.","Comparez attente et longueur de file, puis changez la graine."],file:"Impredictibilite_processus_simple.S8",check:"Avec des arrivées espacées de 6 min et un traitement fixe de 5 min, un serveur disponible n’accumule pas de file."},{id:"objets",title:"Les cinq objets essentiels",duration:9,page:18,end:31,intro:"SIMUL8 assemble quelques objets simples. Leur rôle compte davantage que leur icône.",objective:"Identifier Start Point, Queue, Activity, Resource et End Point.",sections:[["Entrer, attendre, travailler, sortir","Le Start Point crée les items. La Queue les conserve en attente. L’Activity les traite et consomme du temps. L’End Point les retire du système et permet de mesurer leur temps de séjour."],["La ressource rend le travail possible","Une Resource représente une personne ou un équipement nécessaire à une activité. Plusieurs activités peuvent se partager une même ressource : créer deux activités ne crée pas automatiquement deux opérateurs."],["Relier et vérifier","Les connexions définissent les chemins possibles. Commencez par un flux linéaire, puis introduisez les bifurcations et les retours. Suivez quelques items pour repérer une sortie manquante ou une boucle involontaire."]],takeaway:"Une activité est une opération ; une ressource est un moyen nécessaire pour l’exécuter.",task:"Construisez un accueil simple dans SIMUL8.",steps:["Placez un Start Point, une Queue, une Activity et un End Point.","Reliez-les dans cet ordre et fixez les durées en minutes.","Lancez le modèle et vérifiez que des items atteignent la sortie."],file:"DOCTEUR.S8",check:"Entrées = sorties + items encore présents, si le modèle ne crée ni ne détruit d’items en cours de route."},{id:"cabinet",title:"Le cas du cabinet médical",duration:12,page:17,end:24,intro:"Le fil rouge du cours : un cabinet de radiologie avec deux médecins, une secrétaire et un opérateur radio.",objective:"Traduire un énoncé en flux, ressources et paramètres.",sections:[["Le parcours du patient","Le patient passe à l’accueil puis attend son médecin. Avec une radio, il est consulté puis règle sa visite. Sans radio, il passe un premier examen, fait une radiographie et revient auprès du même médecin avant de payer."],["Les données du cours","Le tableau 2 (p. 24) utilise des rendez-vous espacés de 20 min par médecin et 20 % de patients arrivant avec une radio. La consultation avec radio suit une triangulaire (8, 10, 13 min) ; la radiographie, une triangulaire (5, 8, 10 min)."],["Ce que l’on veut décider","L’ajout d’un troisième médecin augmente aussi la charge de la secrétaire et de l’opérateur. Étudiez l’ensemble du processus. Le petit laboratoire du site isole une seule file pour apprendre : il ne reproduit pas ce cabinet complet."]],takeaway:"Une amélioration locale peut déplacer le goulot vers une ressource partagée.",task:"Ouvrez DOCTEUR.S8 et retrouvez les deux parcours des patients.",steps:["Identifiez les deux médecins et les étapes communes.","Suivez un patient avec radio, puis un patient sans radio.","Relevez les paramètres dans le tableau 2 avant de modifier le modèle."],file:"DOCTEUR.S8",check:"Le patient qui revient de la radiographie doit retrouver son médecin, avec la priorité décrite dans l’énoncé."},{id:"arrivees",title:"Paramétrer les arrivées",duration:8,page:35,end:44,intro:"Le rythme d’entrée conditionne la charge du système. Une fréquence moyenne et un planning de rendez-vous ne sont pas interchangeables.",objective:"Distinguer intervalle entre arrivées, planning et variation au cours du temps.",sections:[["Vérifier les unités","Si l’intervalle moyen vaut 6 minutes, le débit moyen est de 10 arrivées par heure. Une confusion entre durée et fréquence change complètement le niveau de charge."],["Adapter la distribution","Fixed convient à un espacement constant. Time Dependant permet de faire varier un paramétrage selon la période. Un planning explicite est pertinent pour des rendez-vous connus ; le cours traite aussi Time Absolute."],["Relier hypothèse et contexte","Des arrivées indépendantes peuvent être modélisées par des intervalles exponentiels. Les rendez-vous du cabinet sont planifiés avec un décalage aléatoire : ce n’est pas le même mécanisme."]],takeaway:"Commencez toujours par préciser l’unité de temps et la signification du paramètre saisi.",task:"Comparez un flux régulier et un flux avec une heure de pointe.",steps:["Ouvrez le modèle Time Dependant sur 24 heures.","Repérez les plages temporelles et les paramètres associés.","Observez à quel moment la file augmente et quand elle se résorbe."],file:"Distribution_Time_Dependant_24heures.S8",check:"Une baisse du débit d’entrée ne vide pas instantanément une file déjà accumulée."},{id:"labels",title:"Caractériser un item avec des labels",duration:10,page:55,end:59,intro:"Les labels transportent des informations avec chaque item. Ils permettent de différencier des patients ou des commandes dans un même flux.",objective:"Utiliser un label pour mémoriser un attribut et orienter un item.",sections:[["Un attribut attaché à l’item","Un label peut indiquer le médecin, la possession d’une radio, une priorité ou une quantité. Deux items dans la même file peuvent donc recevoir des traitements différents."],["Initialiser, utiliser, modifier","Définissez la valeur à l’entrée, utilisez-la pour choisir un chemin ou une durée, puis modifiez-la lors d’un événement approprié. Après une radiographie, la possession de radio change ; l’identité du médecin, elle, reste utile."],["Garder la valeur initiale si nécessaire","Si un attribut change pendant le parcours, copiez sa valeur initiale dans un autre label pour segmenter les résultats par catégorie d’entrée. Le cours l’illustre pour la possession initiale d’une radio (p. 51)."]],takeaway:"Un label décrit l’item ; il ne crée pas à lui seul une règle de routage.",task:"Repérez le lien entre le label d’un item et sa destination.",steps:["Ouvrez Routing_out_Label_1.S8.","Inspectez la règle Routing Out et le label utilisé.","Vérifiez le chemin d’items portant des valeurs différentes."],file:"Routing_out_Label_1.S8",check:"Chaque valeur de label attendue doit avoir une destination cohérente."},{id:"files",title:"Comprendre une file d’attente",duration:9,page:62,end:65,intro:"Une file stocke des items en attente, mais son comportement dépend de sa capacité et de la règle de sélection.",objective:"Distinguer FIFO, LIFO, priorité et capacité.",sections:[["Choisir l’ordre de passage","FIFO sert le premier arrivé ; LIFO privilégie le dernier arrivé. Une priorité peut reclasser les items. Le choix doit représenter la politique réelle et être cohérent avec le Routing In de l’activité."],["Capacité et temporisation","Une capacité maximale limite le nombre d’items stockés. Une durée minimale impose une attente avant traitement ; une durée maximale peut représenter une péremption ou un abandon selon le paramétrage."],["Observer au bon endroit","La longueur de file et l’attente ne sont pas le temps de séjour total. Un item peut visiter plusieurs files, ou la même file plusieurs fois. Les statistiques de chaque visite ne se cumulent pas automatiquement par patient."]],takeaway:"Mesurez séparément la quantité en attente, le temps d’attente et le temps total dans le système.",task:"Observez la différence entre ordre d’arrivée et ordre de sortie.",steps:["Ouvrez LIFO.S8.","Suivez plusieurs items identifiables dans la file.","Comparez l’ordre de sortie à celui d’une discipline FIFO."],file:"LIFO.S8",check:"En LIFO, un ancien item peut attendre longtemps si de nouveaux items arrivent continuellement."},{id:"stock",title:"Initialiser et gérer un stock",duration:8,page:64,end:67,intro:"Commencer avec une file vide est une hypothèse. Dans un atelier, un stock initial peut déjà être présent.",objective:"Distinguer état initial, stock minimum et péremption.",sections:[["L’état initial influence le début","Une file peut contenir une quantité initiale déterministe ou aléatoire. Ce choix influe sur les premières observations et doit correspondre à l’objectif de l’étude."],["Temps minimal et péremption","Un temps minimal en stock peut représenter un séchage. Une limite de séjour peut représenter une date de péremption. Ces règles ont des effets distincts sur la disponibilité des items."],["Documenter les règles","Indiquez les quantités initiales, les capacités et les règles de réapprovisionnement. Sans ces éléments, une comparaison entre scénarios peut mélanger changement de politique et changement d’état initial."]],takeaway:"Le stock initial est un paramètre du modèle, pas un détail de présentation.",task:"Étudiez un modèle à stock initial fixe.",steps:["Ouvrez Initialisation_Stock_deterministe.S8.","Relevez le contenu initial des files.","Réinitialisez et vérifiez que le même état de départ est rétabli."],file:"Initialisation_Stock_deterministe.S8",check:"Une nouvelle réplication doit repartir de l’état initial prévu, pas de l’état final de la précédente."},{id:"ressources",title:"Partager des ressources",duration:9,page:68,end:70,intro:"Une personne peut intervenir sur plusieurs activités. La représenter comme une ressource partagée rend cette contrainte visible.",objective:"Comprendre la contention et les pools de ressources.",sections:[["Demander puis libérer","Une activité peut devoir attendre une ressource avant de commencer. Vérifiez combien d’unités elle demande et à quel moment elles sont libérées. Une ressource retenue trop longtemps bloque les étapes suivantes."],["Capacité et compétence","Deux opérateurs disponibles ne sont pas forcément interchangeables. Un pool représente des ressources substituables pour une opération donnée. Le cours utilise Pool.S8 et un exemple de polyvalence."],["Repérer le vrai goulot","Une activité vide peut manquer d’items, de ressource ou d’une condition de synchronisation. Le taux d’occupation seul ne suffit pas : examinez les états d’attente et les files en amont."]],takeaway:"Ajouter une activité ne produit aucun gain si la ressource partagée reste saturée.",task:"Explorez le partage d’opérateurs dans Pool.S8.",steps:["Identifiez les ressources qualifiées et spécialisées.","Repérez les activités autorisées à utiliser chaque type.","Comparez un ajout de ressource et une modification de polyvalence."],file:"Pool.S8",check:"Un pool doit respecter les compétences réellement substituables pour la tâche."},{id:"shifts",title:"Modéliser les horaires",duration:8,page:53,end:54,intro:"Une ressource disponible huit heures ne doit pas être évaluée comme si elle travaillait vingt-quatre heures.",objective:"Interpréter une disponibilité et le dénominateur d’un taux d’utilisation.",sections:[["Définir des plages de présence","Les shifts décrivent les périodes de disponibilité des ressources ou des activités. Le cabinet utilise notamment les plages 9 h–12 h 30 et 14 h–19 h 30 dans une variante."],["Ne pas confondre les taux","Le cours montre qu’un taux calculé sur 10 h 30 d’ouverture diffère d’un taux rapporté à 9 heures de présence. Vérifiez la base temporelle et les états Off shift avant d’interpréter un pourcentage."],["Vérifier les frontières","Que devient une tâche commencée juste avant une pause ? Que devient un patient attendant un paiement ? Testez ces moments précis : les règles d’interruption et de disponibilité ont un effet sur les résultats."]],takeaway:"Un taux d’utilisation doit toujours être accompagné de sa période de référence.",task:"Comparez les variantes de ressources et de shifts du cabinet.",steps:["Ouvrez DOCTEUR_Shift.S8 et relevez les horaires.","Observez l’état des activités à la pause.","Comparez l’interprétation des résultats avec DOCTEUR_ressource.S8."],file:"DOCTEUR_Shift.S8",check:"Une activité Off shift n’est pas simplement une activité disponible mais inoccupée."},{id:"routing",title:"Choisir les règles de routage",duration:12,page:72,end:90,intro:"Routing In décide d’où viennent les items ; Routing Out décide où ils partent après traitement.",objective:"Distinguer sélection d’entrée, destination de sortie et assemblage.",sections:[["À l’entrée : quelle file alimentera l’activité ?","Les méthodes de sélection peuvent privilégier une entrée, circuler entre plusieurs files, choisir des items selon leur ancienneté ou collecter plusieurs composants. Vérifiez les conditions exactes de la méthode choisie."],["À la sortie : quelle destination ?","Percent répartit selon des pourcentages ; Label utilise une caractéristique ; Shortest recherche une file plus courte. La règle doit traduire votre politique de décision et prendre en compte les destinations accessibles."],["Collect n’est pas un simple choix","Un assemblage peut exiger plusieurs composants avant de commencer. La présence d’un seul type de composant ne suffit alors pas. Les options d’assemblage et de correspondance des labels doivent être étudiées ensemble."]],takeaway:"Validez la circulation sur quelques items avant de tirer des conclusions statistiques.",task:"Comparez une répartition en pourcentage et une recherche de file courte.",steps:["Ouvrez Routing_out_Percent.S8 et relevez les poids.","Ouvrez Routing_out_Shortest.S8 et repérez les files candidates.","Expliquez pourquoi les deux règles peuvent donner des charges différentes."],file:"Routing_out_Percent.S8",check:"Une répartition à 50/50 n’implique pas des files identiques si les traitements ont des durées différentes."},{id:"resultats",title:"Lire les résultats sans se tromper",duration:11,page:46,end:54,intro:"Les chiffres du modèle répondent à une question seulement si l’expérience a été correctement définie.",objective:"Distinguer durée, warm-up, réplications et indicateurs.",sections:[["Choisir la bonne expérience","Définissez une durée et un état de départ. Pour un système permanent, une période de warm-up peut neutraliser le biais initial. Pour un système qui redémarre vide chaque jour, ce début de journée fait partie du phénomène étudié."],["Répéter et comparer","Le cours recommande au moins 30 réplications pour l’analyse de moyennes. Examinez l’incertitude entre réplications et conservez les mêmes hypothèses hors du facteur testé. Une seule exécution ne démontre pas la supériorité d’un scénario."],["Savoir ce qui a été mesuré","À la sortie, le temps de séjour concerne les items sortis. Les items encore présents ne sont pas inclus dans cette moyenne. Dans une simulation courte ou saturée, cela peut donner une image trop favorable de l’attente."]],takeaway:"Un résultat fiable précise la population mesurée, l’horizon et l’incertitude.",task:"Dans le laboratoire, comparez un et deux serveurs avec la même graine.",steps:["Exécutez puis mémorisez le premier scénario.","Ajoutez un serveur en conservant les autres paramètres.","Comparez les résultats et discutez la limite d’une seule réplication."],file:"DOCTEUR.S8",check:"Une moyenne de séjour des patients sortis ne mesure pas le séjour final de ceux qui attendent encore."},{id:"logic",title:"Information Store et Visual Logic",duration:12,page:99,end:109,intro:"Lorsque les réglages standards ne suffisent plus, des données partagées et une logique événementielle complètent le modèle.",objective:"Distinguer labels, données globales et traitements déclenchés par événements.",sections:[["Données globales ou propres à l’item ?","Un label suit un item. L’Information Store contient des données du modèle, telles que des variables ou des tableaux. Choisissez la portée adaptée pour éviter de remplacer par erreur une information partagée."],["Un événement déclenche une action","Visual Logic peut intervenir lors d’événements d’un objet ou à des instants définis. Le moment du déclenchement compte : une modification avant la sélection d’un item ne produit pas forcément le même effet qu’après."],["Commencer petit","Initialisez explicitement vos variables, testez une règle isolée et observez les valeurs. Documentez les entrées et les effets de chaque procédure avant d’enchaîner plusieurs règles."]],takeaway:"Une bonne règle précise ce qui change, quand cela change et sur quel objet.",task:"Explorez les données du cabinet médical.",steps:["Ouvrez DOCTEUR_Information_Store_0.S8.","Repérez les données stockées et les objets qui les utilisent.","Cherchez les événements qui lisent ou modifient ces données."],file:"DOCTEUR_Information_Store_0.S8",check:"Une valeur propre à chaque patient ne doit pas être écrasée dans une variable globale unique."},{id:"synchronisation",title:"Synchroniser des processus",duration:11,page:110,end:122,intro:"Les flux réels peuvent diverger puis se rejoindre. Il faut alors préciser quels composants ou tâches doivent être réunis.",objective:"Reconnaître les contraintes de synchronisation et les risques de blocage.",sections:[["Divergence et convergence","Un processus peut se séparer en tâches parallèles, puis attendre leur achèvement. Une activité de réunion doit recevoir les bons composants, pas simplement le premier disponible de chaque catégorie."],["Quantité et identité","Une quantité attendue fixe une condition de collecte. Un label d’identification permet de faire correspondre les pièces d’une même commande. Confondre ces deux contraintes peut assembler des éléments incompatibles."],["Tester les cas incomplets","Que se passe-t-il si un composant arrive tard, manque ou expire ? Observez la file de réunion et recherchez une attente qui ne peut plus se terminer. Les modèles fournis permettent de comparer plusieurs configurations."]],takeaway:"Une convergence exige une règle explicite de quantité et, si nécessaire, de correspondance.",task:"Suivez les deux branches d’un processus parallèle.",steps:["Ouvrez Synchro_processus_paralleles.S8.","Identifiez la séparation et le point de réunion.","Augmentez la durée d’une branche et observez l’attente à la convergence."],file:"Synchro_processus_paralleles.S8",check:"La durée totale d’étapes réellement parallèles dépend de la branche la plus longue, plus les opérations communes."}],v0=[{module:"fondements",q:"Pourquoi répéter une simulation avec plusieurs graines ?",options:["Pour supprimer les files d’attente","Pour estimer la variabilité des résultats","Pour accélérer chaque activité"],answer:1,explanation:"Chaque exécution est une réalisation aléatoire. Plusieurs réplications permettent d’étudier la dispersion et l’incertitude des indicateurs.",page:49},{module:"fondements",q:"Deux modèles ont les mêmes durées moyennes. Leur attente sera-t-elle nécessairement identique ?",options:["Oui, seule la moyenne compte","Oui, si la durée de simulation est identique","Non, la variabilité peut modifier l’attente"],answer:2,explanation:"La variabilité des arrivées et des traitements peut créer des accumulations même avec les mêmes moyennes.",page:15},{module:"premier-modele",q:"Quel objet conserve les items avant leur traitement ?",options:["Queue","End Point","Resource"],answer:0,explanation:"Une Queue représente la file ou le stock. L’Activity effectue le traitement, et la Resource est un moyen nécessaire à ce traitement.",page:30},{module:"premier-modele",q:"Dans le cabinet du cours, que vaut la part moyenne des patients arrivant avec une radio ?",options:["80 %","50 %","20 %"],answer:2,explanation:"Le tableau 2 donne une loi de Bernoulli de paramètre p = 0,2 pour la possession d’une radio à l’arrivée.",page:24},{module:"items",q:"Un intervalle moyen de 6 minutes correspond à quel débit moyen ?",options:["6 items par heure","10 items par heure","60 items par heure"],answer:1,explanation:"Une heure contient 60 minutes : 60 / 6 = 10 arrivées par heure.",page:5},{module:"items",q:"À quoi sert un label « médecin » porté par un patient ?",options:["À mémoriser son médecin pour guider son parcours","À augmenter automatiquement le nombre de médecins","À rendre constante sa durée de consultation"],answer:0,explanation:"Le label mémorise un attribut de l’item. Une règle de routage doit ensuite utiliser cette information.",page:57},{module:"files",q:"En LIFO, quel item est servi en premier parmi ceux présents ?",options:["Le plus ancien","Un item choisi au hasard","Le dernier arrivé"],answer:2,explanation:"LIFO signifie Last In, First Out : dernier entré, premier sorti. FIFO sert au contraire le premier arrivé.",page:64},{module:"files",q:"Le temps minimal de séjour en file peut représenter…",options:["Le nombre maximal de machines","Un temps de séchage obligatoire","Le débit maximal d’entrée"],answer:1,explanation:"Une temporisation minimale impose un délai avant que l’item puisse quitter la file pour être traité.",page:64},{module:"ressources",q:"Deux activités partagent un unique opérateur indispensable. Peuvent-elles toutes deux l’utiliser au même instant ?",options:["Non, si chacune demande une unité exclusive","Oui, car elles ont deux icônes distinctes","Oui, si leurs files sont pleines"],answer:0,explanation:"La ressource partagée impose une contrainte de capacité. Dessiner deux activités ne double pas l’effectif.",page:68},{module:"ressources",q:"Avant de comparer deux taux d’utilisation, que faut-il vérifier ?",options:["La couleur des activités","Le nombre de connexions","La période et la disponibilité servant de référence"],answer:2,explanation:"Un taux rapporté à l’ouverture globale et un taux rapporté aux heures de présence n’ont pas le même dénominateur.",page:53},{module:"activites",q:"Routing Out intervient principalement pour…",options:["Choisir une destination après une activité","Définir le stock initial","Changer la durée de la
